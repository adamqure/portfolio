name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # site/ is pre-built and committed: run `python3 build.py` locally before pushing.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and other IndexNow engines) the pages changed, so they recrawl now instead of eventually.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=$(basename "$(ls site/*.txt | grep -Ev '/(robots|llms)\.txt$')" .txt)
          URLS=$(grep -o '<loc>[^<]*' site/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -sc .)
          sleep 30  # give the Pages CDN a moment to serve the new files
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"adamure.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://adamure.com/$KEY.txt\",\"urlList\":$URLS}"
